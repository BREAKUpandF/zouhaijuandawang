		// 布局自动切换相关
		let currentLayout = 'heart';

		// 布局切换函数
		function switchLayout(layout) {
			currentLayout = layout;
			switch (layout) {
				case 'heart':
					heart();
					break;
				case 'starry':
					starry();
					break;
				case 'ribbon':
					ribbon();
					break;
				case 'starlight':
					starlight();
					break;
			}
			// 重置自动切换计时器
			resetAutoSwitch();
		}

		// 重置自动切换计时器
		function resetAutoSwitch() {
			if (autoSwitchTimer) {
				clearTimeout(autoSwitchTimer);
			}
			autoSwitchTimer = setTimeout(autoSwitchLayout, AUTO_SWITCH_INTERVAL);
		}

		// 自动切换布局
		function autoSwitchLayout() {
			const layouts = ['heart', 'starry', 'ribbon', 'starlight'];
			const currentIndex = layouts.indexOf(currentLayout);
			const nextIndex = (currentIndex + 1) % layouts.length;
			switchLayout(layouts[nextIndex]);
		}

		// 优化AI生成函数
		async function generateAILoveMessage() {
			try {
				const maxRetries = 2;
				let retryCount = 0;
				let lastError = null;

				// 根据时间生成不同的提示
				const hour = new Date().getHours();
				let timeContext = '';
				if (hour >= 5 && hour < 11) {
					timeContext = '清晨';
				} else if (hour >= 11 && hour < 16) {
					timeContext = '午后';
				} else if (hour >= 16 && hour < 19) {
					timeContext = '黄昏';
				} else {
					timeContext = '夜晚';
				}

				while (retryCount < maxRetries) {
					try {
						const response = await fetch('https://api.openai.com/v1/chat/completions', {
							method: 'POST',
							headers: {
								'Content-Type': 'application/json',
								'Authorization': 'Bearer ' + atob('sk-...5uAA')
							},
							body: JSON.stringify({
								model: "gpt-3.5-turbo",
								messages: [{
									role: "system",
									content: `你是一个浪漫的诗词生成器。请根据现在是${timeContext}，生成一句富有诗意的话语，要求：
									1. 字数在20字以内
									2. 风格要优美含蓄
									3. 要有时间场景感
									4. 可以引用古诗词
									5. 每次生成的内容都要独特`
								}, {
									role: "user",
									content: `请生成一句${timeContext}的浪漫诗句`
								}],
								temperature: 0.9,
								max_tokens: 100
							})
						});

						if (!response.ok) {
							throw new Error(`HTTP error! status: ${response.status}`);
						}
						else {
							console.log('AI生成成功');
						}

						const data = await response.json();
						return data.choices[0].message.content.trim();
					} catch (error) {
						lastError = error;
						retryCount++;
						await new Promise(resolve => setTimeout(resolve, 2000));
					}
				}

				// 如果API调用失败，使用本地生成
				console.log('使用本地生成');
				return generateLocalAIMessage();
			} catch (error) {
				console.log('降级到本地生成');
				return generateLocalAIMessage();
			}
		}

		// 扫描文件夹中的文件
		async function scanFiles() {
			try {
				// 初始化数组
				imageList = [];
				musicList = [];

				// 创建一个函数来检查文件是否存在
				async function checkFile(path) {
					try {
						const response = await fetch(path, { method: 'HEAD' });
						return response.ok;
					} catch {
						return false;
					}
				}

				// 扫描图片文件 - 使用字母命名格式 (a.png, b.png, etc.)
				const imgFiles = ['a.png', 'b.png', 'c.png', 'd.png', 'e.png'];
				for (const filename of imgFiles) {
					const path = `img/${filename}`;
					if (await checkFile(path)) {
						imageList.push(filename);
					}
				}

				// 如果没有找到图片，使用默认图片
				if (imageList.length === 0) {
					console.log('未找到图片，使用默认图片');
					imageList = ['a.png'];
				}

				// 扫描音乐文件 - 使用数字命名格式 (1.mp3, 2.mp3, etc.)
				for (let i = 1; i <= 10; i++) {
					const filename = `${i}.mp3`;
					const path = `music/${filename}`;
					if (await checkFile(path)) {
						musicList.push(filename);
					}
				}

				// 如果没有找到音乐，使用默认音乐
				if (musicList.length === 0) {
					console.log('未找到音乐，使用默认音乐');
					musicList = ['1.mp3'];
				}

				console.log('找到的图片:', imageList);
				console.log('找到的音乐:', musicList);

				return true;
			} catch (error) {
				console.error('扫描文件失败:', error);
				return false;
			}
		}

		// 音乐控制相关
		const bgm = document.getElementById('bgm');
		const toggleMusicBtn = document.getElementById('toggle-music');
		let isMusicPlaying = true; // 默认为开启状态
		let currentMusicIndex = -1;

		// 修改音乐初始化函数
		function initMusic() {
			if (musicList.length > 0) {
				currentMusicIndex = Math.floor(Math.random() * musicList.length);
				bgm.src = 'music/' + musicList[currentMusicIndex];
				bgm.loop = true; // 设置为循环播放
				
				// 添加音乐结束事件监听器
				bgm.addEventListener('ended', playNextMusic);

				// 设置初始按钮状态
				toggleMusicBtn.textContent = '🔊 暂停音乐';

				// 尝试自动播放
				autoPlayMusic();
			}
		}

		// 优化自动播放函数
		async function autoPlayMusic() {
			try {
				// 尝试播放
				const playPromise = bgm.play();
				
				if (playPromise !== undefined) {
					await playPromise;
					isMusicPlaying = true;
					toggleMusicBtn.textContent = '🔊 暂停音乐';
				}
			} catch (error) {
				console.log('自动播放失败，等待用户交互:', error);
				isMusicPlaying = false;
				toggleMusicBtn.textContent = '🎵 播放音乐';
				
				// 添加一次性点击事件来启动音乐
				const startMusic = async () => {
					try {
						await bgm.play();
						isMusicPlaying = true;
						toggleMusicBtn.textContent = '🔊 暂停音乐';
						document.removeEventListener('click', startMusic);
					} catch (e) {
						console.log('播放失败:', e);
					}
				};
				
				// 添加多个事件监听器以提高兼容性
				document.addEventListener('click', startMusic);
				document.addEventListener('touchstart', startMusic);
				document.addEventListener('keydown', startMusic);
			}
		}

		// 播放下一首音乐
		function playNextMusic() {
			if (musicList.length > 0) {
				currentMusicIndex = (currentMusicIndex + 1) % musicList.length;
				bgm.src = 'music/' + musicList[currentMusicIndex];
				if (isMusicPlaying) {
					bgm.play().catch(error => {
						console.log('播放下一首失败:', error);
					});
				}
			}
		}

		// 音乐控制函数
		async function toggleMusic() {
			try {
				if (isMusicPlaying) {
					await bgm.pause();
					toggleMusicBtn.textContent = '🎵 播放音乐';
				} else {
					if (!bgm.src || bgm.error) {
						initMusic();
					}
					await bgm.play();
					toggleMusicBtn.textContent = '🔊 暂停音乐';
				}
				isMusicPlaying = !isMusicPlaying;
			} catch (error) {
				console.error('音乐控制出错:', error);
			}
		}

		// 音乐按钮事件监听
		toggleMusicBtn.addEventListener('click', toggleMusic);

		// 在页面加载完成后初始化所有功能
		document.addEventListener('DOMContentLoaded', function() {
			initializeFiles();
			initLayoutButtons();
			initTouchEvents(); // 初始化触摸事件
		});

		// 添加页面可见性变化监听
		document.addEventListener('visibilitychange', function() {
			if (document.hidden) {
				// 页面隐藏时暂停音乐
				if (isMusicPlaying) {
					bgm.pause();
				}
			} else {
				// 页面显示时恢复音乐
				if (isMusicPlaying) {
					bgm.play().catch(error => {
						console.log('恢复播放失败:', error);
					});
				}
			}
		});

		// 获取当前时间场景
		function getCurrentScene() {
			const hour = new Date().getHours();
			if (hour >= 5 && hour < 11) return 'morning';
			if (hour >= 11 && hour < 16) return 'afternoon';
			if (hour >= 16 && hour < 19) return 'evening';
			return 'night';
		}

		// 根据时间和场景生成表白句子
		function generateLocalAIMessage() {
			const hour = new Date().getHours();
			let timeContext = '';
			
			if (hour >= 5 && hour < 11) {
				timeContext = 'morning';
			} else if (hour >= 11 && hour < 16) {
				timeContext = 'afternoon';
			} else if (hour >= 16 && hour < 19) {
				timeContext = 'evening';
			} else {
				timeContext = 'night';
			}

			const templates = aiTemplates[timeContext];
			const randomIndex = Math.floor(Math.random() * templates.length);
			return templates[randomIndex];
		}

		// 修改消息更新逻辑
		async function updateMessage() {
			try {
				// 增加本地AI生成的概率到50%
				const useAI = Math.random() < 0.5;
				let message;
				
				if (useAI) {
					message = await generateAILoveMessage();
				} else {
					message = getRandomMessage();
				}
				
				// 添加打字机效果
				const intro = $('.intro');
				intro.empty();
				let index = 0;
				
				function typeWriter() {
					if (index < message.length) {
						intro.append(message.charAt(index));
						index++;
						setTimeout(typeWriter, 100);
					}
				}
				
				typeWriter();
			} catch (error) {
				console.error('更新消息失败:', error);
				$('.intro').text(getRandomMessage());
			}
		}

		// 获取随机消息
		function getRandomMessage() {
			const hour = new Date().getHours();
			let timeBasedMessages;

			// 根据时间选择合适的消息
			if (hour >= 5 && hour < 11) {
				timeBasedMessages = sceneMessages.morning;
			} else if (hour >= 11 && hour < 16) {
				timeBasedMessages = sceneMessages.afternoon;
			} else if (hour >= 16 && hour < 19) {
				timeBasedMessages = sceneMessages.evening;
			} else {
				timeBasedMessages = sceneMessages.night;
			}

			// 随机选择消息类型
			const messageTypes = [
				{ weight: 0.4, messages: loveMessages },           // 40% 概率使用基础表白句子
				{ weight: 0.4, messages: timeBasedMessages },      // 40% 概率使用时间相关句子
				{ weight: 0.2, messages: weatherMessages.sunny }   // 20% 概率使用天气相关句子
			];

			const random = Math.random();
			let weightSum = 0;
			for (const type of messageTypes) {
				weightSum += type.weight;
				if (random < weightSum && type.messages && type.messages.length > 0) {
					return type.messages[Math.floor(Math.random() * type.messages.length)];
				}
			}
			
			// 如果上面的随机选择都失败了，返回默认消息
			return "邹海娟，你是我生命中最美的风景";
		}

		// 在原有的setInterval中替换消息更新逻辑
		var s = setInterval(function () {
			if (imageList.length === 0) return;
			
			var rand_in = parseInt(Math.random() * _in.length, 10);
			var rand_out = parseInt(Math.random() * _out.length, 10);
			if (CurPersonNum >= personArray.length) {
				CurPersonNum = 0;
			}
			$('.show_info').show();
			$('.show_info').addClass(_in[rand_in]);
			setTimeout(function () {
				$('.show_info').removeClass(_in[rand_in]);
				// 更改展示的图片
				var x = imageList[Math.floor(Math.random() * imageList.length)];
				$('.show_info img').attr('src', 'img/' + x);
				// 更新表白句子
				updateMessage();
				++CurPersonNum;
				setTimeout(function () {
					$('.show_info').addClass(_out[rand_out]);
					setTimeout(function () {
						$('.show_info').removeClass(_out[rand_out]);
						$('.show_info').hide();
					}, 1000);
				}, 2500); // 增加展示时间
			}, 1000);
		}, 6000); // 增加间隔时间从4500ms到8000ms

		function generateContent() {
			if (imageList.length === 0) return;
			
			// 生成虚拟数据
			for (var i = 0; i < 200; i++) {
				var x = imageList[Math.floor(Math.random() * imageList.length)];
				var imgname = 'img/' + x;
				personArray.push({
					image: imgname
				});
			}

			var table = new Array;
			for (var i = 0; i < personArray.length; i++) {
				table[i] = new Object();
				if (i < personArray.length) {
					table[i] = personArray[i];
					table[i].src = personArray[i].thumb_image;
				}
				table[i].p_x = i % 20 + 1;
				table[i].p_y = Math.floor(i / 20) + 1;
			}

			init();
			animate();
		}

		var camera, scene, renderer;
		var controls;
		var objects = [];
		var targets = { table: [], sphere: [], helix: [], grid: [], heart: [], starry: [], ribbon: [], starlight: [] };

		// 修改心形布局的计算方法
		function calculateHeart(t, scale = 15) {
			// 参数方程式心形
			const x = scale * (16 * Math.pow(Math.sin(t), 3));
			const y = scale * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
			return { x, y };
		}

		function init() {
			camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 10000);
			camera.position.z = 3000;

			scene = new THREE.Scene();

			// table (heart)
			for (var i = 0; i < table.length; i++) {
				var element = document.createElement('div');
				element.className = 'element';
				element.style.backgroundColor = 'rgba(0,127,127,' + (Math.random() * 0.5 + 0.25) + ')';

				var img = document.createElement('img');
				img.src = table[i].image;
				element.appendChild(img);

				var object = new THREE.CSS3DObject(element);
				object.position.x = Math.random() * 4000 - 2000;
				object.position.y = Math.random() * 4000 - 2000;
				object.position.z = Math.random() * 4000 - 2000;
				scene.add(object);

				objects.push(object);

				// 心形布局
				var object = new THREE.Object3D();
				const t = (i / table.length) * 2 * Math.PI;
				const heart = calculateHeart(t, 100);
				
				object.position.x = heart.x;
				object.position.y = heart.y;
				object.position.z = 0;

				targets.table.push(object);
			}

			renderer = new THREE.CSS3DRenderer();
			renderer.setSize(window.innerWidth, window.innerHeight);
			renderer.domElement.style.position = 'absolute';
			document.getElementById('container').appendChild(renderer.domElement);

			controls = new THREE.TrackballControls(camera, renderer.domElement);
			controls.rotateSpeed = 0.5;
			controls.minDistance = 500;
			controls.maxDistance = 6000;
			controls.addEventListener('change', render);

			transform(targets.table, 2000);
			window.addEventListener('resize', onWindowResize, false);
		}

		function transform(targets, duration) {
			TWEEN.removeAll();
			for (var i = 0; i < objects.length; i++) {
				var object = objects[i];
				var target = targets[i];
				new TWEEN.Tween(object.position)
					.to({ x: target.position.x, y: target.position.y, z: target.position.z }, Math.random() * duration + duration)
					.easing(TWEEN.Easing.Exponential.InOut)
					.start();
				new TWEEN.Tween(object.rotation)
					.to({ x: target.rotation.x, y: target.rotation.y, z: target.rotation.z }, Math.random() * duration + duration)
					.easing(TWEEN.Easing.Exponential.InOut)
					.start();
			}
			new TWEEN.Tween(this)
				.to({}, duration * 2)
				.onUpdate(render)
				.start();
		}

		// 心形布局
		function heart() {
			const scale = 100;
			const offsetY = 300; // 向上偏移以使心尖朝下
			for (let i = 0; i < objects.length; i++) {
				const t = (i / objects.length) * 2 * Math.PI;
				// 修改后的心形方程，使心尖朝下
				const x = scale * 16 * Math.pow(Math.sin(t), 3);
				const y = scale * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) + offsetY;
				const z = 0;

				const target = new THREE.Object3D();
				target.position.set(x, y, z);
				// 添加轻微的旋转效果
				target.rotation.z = Math.sin(t) * 0.3;
				targets.heart[i] = target;
			}
			transform(targets.heart, 2000);
		}

		// 星空布局 - 更加梦幻的效果
		function starry() {
			const radius = 1000;
			for (let i = 0; i < objects.length; i++) {
				const phi = Math.acos(-1 + (2 * i) / objects.length);
				const theta = Math.sqrt(objects.length * Math.PI) * phi;
				const spiral = (i / objects.length) * Math.PI * 2;

				const target = new THREE.Object3D();
				target.position.x = radius * Math.cos(theta + spiral) * Math.sin(phi);
				target.position.y = radius * Math.sin(theta + spiral) * Math.sin(phi);
				target.position.z = radius * Math.cos(phi);

				const vector = new THREE.Vector3();
				vector.copy(target.position).multiplyScalar(2);
				target.lookAt(vector);
				target.rotation.z = Math.random() * Math.PI;

				targets.starry[i] = target;
			}
			transform(targets.starry, 2500);
		}

		// 丝带布局 - 更加飘逸的效果
		function ribbon() {
			const spacing = 10;
			const turns = 6;
			const heightScale = 1.5;
			for (let i = 0; i < objects.length; i++) {
				const t = (i / objects.length) * turns * Math.PI * 2;
				const radius = 900 + Math.sin(t * 3) * 100;

				const target = new THREE.Object3D();
				target.position.x = radius * Math.cos(t);
				target.position.y = (i - objects.length/2) * spacing * heightScale;
				target.position.z = radius * Math.sin(t);

				const vector = new THREE.Vector3();
				vector.x = target.position.x * 2;
				vector.y = target.position.y;
				vector.z = target.position.z * 2;
				target.lookAt(vector);
				target.rotation.z = t * 0.3;

				targets.ribbon[i] = target;
			}
			transform(targets.ribbon, 2500);
		}

		// 星光布局 - 更加绚丽的效果
		function starlight() {
			const layers = 5;
			const itemsPerLayer = Math.ceil(objects.length / layers);
			
			for (let i = 0; i < objects.length; i++) {
				const layer = Math.floor(i / itemsPerLayer);
				const angleStep = (2 * Math.PI) / itemsPerLayer;
				const angle = (i % itemsPerLayer) * angleStep;
				const spiralOffset = (layer / layers) * Math.PI * 2;
				
				const radius = 500 + layer * 150;
				const target = new THREE.Object3D();
				
				target.position.x = radius * Math.cos(angle + spiralOffset);
				target.position.y = (layer - layers/2) * 150 + Math.sin(angle * 3) * 50;
				target.position.z = radius * Math.sin(angle + spiralOffset);
				
				const vector = new THREE.Vector3();
				vector.copy(target.position).multiplyScalar(2);
				target.lookAt(vector);
				target.rotation.z = angle * 0.3;
				
				targets.starlight[i] = target;
			}
			transform(targets.starlight, 2500);
		}

		function onWindowResize() {
			camera.aspect = window.innerWidth / window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth, window.innerHeight);
			render();
		}

		function animate() {
			requestAnimationFrame(animate);
			TWEEN.update();
			controls.update();
			// 缓慢自动旋转
			scene.rotation.y += 0.002;
			render();
		}

		function render() {
			renderer.render(scene, camera);
		}

		// 添加移动端触摸事件支持
		function initTouchEvents() {
			let touchStartX = 0;
			let touchStartY = 0;

			document.addEventListener('touchstart', function(e) {
				touchStartX = e.touches[0].clientX;
				touchStartY = e.touches[0].clientY;
			}, false);

			document.addEventListener('touchmove', function(e) {
				if (!touchStartX || !touchStartY) {
					return;
				}

				let touchEndX = e.touches[0].clientX;
				let touchEndY = e.touches[0].clientY;

				let xDiff = touchStartX - touchEndX;
				let yDiff = touchStartY - touchEndY;

				if (Math.abs(xDiff) > Math.abs(yDiff)) {
					if (xDiff > 0) {
						// 向左滑动
						switchLayout('starry');
					} else {
						// 向右滑动
						switchLayout('heart');
					}
				} else {
					if (yDiff > 0) {
						// 向上滑动
						switchLayout('ribbon');
					} else {
						// 向下滑动
						switchLayout('starlight');
					}
				}

				touchStartX = 0;
				touchStartY = 0;
			}, false);
		}
	</script>
